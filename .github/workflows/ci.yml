name: Push

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: read-all

jobs:
  release:
    permissions:
      contents: write
    uses: quike/workflow-github/.github/workflows/release.yml@15a6f8baec0dea98eb96de5766c595404ae3424d # v1
    secrets: inherit

  build:
    needs: release
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # goreleaser resolves the release tag semantic-release just pushed.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Release outputs
        run: |
          echo "release-published: ${{ needs.release.outputs.release-published }}"
          echo "release-version:   ${{ needs.release.outputs.release-version }}"
          echo "release-major:     ${{ needs.release.outputs.release-major }}"
          echo "release-minor:     ${{ needs.release.outputs.release-minor }}"
          echo "release-patch:     ${{ needs.release.outputs.release-patch }}"
          echo "release-type:      ${{ needs.release.outputs.release-type }}"
          echo "release-git-head:  ${{ needs.release.outputs.release-git-head }}"
          echo "release-git-tag:   ${{ needs.release.outputs.release-git-tag }}"
      - name: Verify and test
        run: make build-init verify test
      - uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7
        with:
          files: target/coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Package and attach release assets
        if: needs.release.outputs.release-published == 'true'
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: 2.18.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ needs.release.outputs.release-git-tag }}
