version: 2

settings:
  logging:
    level: info

groups:
  # multi-command group — all three entry forms, mixed
  - name: multi
    description: "Mixed-form command sequence"
    shell: sh
    commands:
      - { command: echo, params: [argv-step] }
      - echo shell-step
      - |
        echo script-line-1
        echo script-line-2

  # single-command group — unchanged, still terse
  - name: single
    description: "Singular form stays first-class"
    command: echo
    params: [single-step]

  # per-command overrides — map form only
  - name: knobs
    description: "Per-command env, dir and silent"
    env:
      LAYER: group
    commands:
      - { command: printenv, params: [LAYER], env: { LAYER: command } }
      - { command: pwd, dir: /tmp }
      - { command: echo, params: [quiet], silent: true }
      - command: echo
        params: [templated]
        dir: '/tmp/{{ env "HOME" }}'
        env:
          SHA: '{{ output "single" }}'

flows:
  ci:
    description: "Multi then single"
    steps:
      - run: [multi]
      - run: [single]
      - run: [knobs]

default: ci
