version: 2

# A dag-mode flow where deploy's when: predicate reads test's output. That
# reference is a real scheduling dependency, so the diagram must draw it.
# test also orders after lint via after:, drawn as a dashed ordering edge.
groups:
  - name: build
    description: "Compile the binary"
    command: go
    params: [build, "./..."]
    cache:
      reads: ["**/*.go"]

  - name: lint
    description: "Static checks"
    command: go
    params: [vet, "./..."]

  - name: test
    description: "Unit tests"
    command: go
    params: [test, '{{ output "build" }}']

  - name: deploy
    description: "Ship it"
    command: ./scripts/deploy.sh

  - name: notify
    description: "Announce the release"
    command: ./scripts/notify.sh
    params: ['{{ output "deploy" }}']

flows:
  ci:
    description: "Build, test, deploy when tests pass, then notify"
    mode: dag
    run:
      - build
      - lint
      # Pure ordering: test reads nothing from lint, so this edge is dashed.
      - group: test
        after: [lint]
      - group: deploy
        when: '{{ eq (output "test") "pass" }}'
      - notify

default: ci
